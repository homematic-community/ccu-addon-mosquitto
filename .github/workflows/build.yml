name: build-release

# Release build. Two ways in:
#
#   * push a tag named exactly like the version in package.json (no "v"
#     prefix, like the old 1.5.8+x releases):
#     `git tag 2.1.2+2 && git push origin 2.1.2+2`
#     - builds all three architectures, runs the tests and publishes the
#     release for that tag;
#   * run it by hand (workflow_dispatch) - same build, but the release is
#     created as a draft prerelease for the maintainer to review.
#
# The daily automatic release for new Mosquitto versions is auto-release.yml.

on:
  push:
    tags:
      # glob, not a regex: <digits>.<digits>.<digits>+<build>
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build_release_body.sh needs tags and history

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      - name: Install patchelf
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf >/dev/null

      - name: Read addon version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # a tag release must carry the version the packages are built with,
          # or the release and its assets would disagree
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package.json version $version"
            exit 1
          fi

      - name: Build addon packages
        run: ./build.sh

      - name: End-to-end test (x86_64 package)
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:webui

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          # a pushed tag is the maintainer's release; a manual run stays a draft
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          makeLatest: ${{ github.ref_type == 'tag' }}
          allowUpdates: true
          artifacts: dist/*
          bodyFile: RELEASE_BODY.md
          tag: "${{ steps.version.outputs.version }}"
          commit: ${{ github.sha }}
