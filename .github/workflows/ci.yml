name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Shell script syntax
        run: |
          bash -n build.sh build_addon.sh build_release_body.sh
          for f in build_in_container.sh addon_files/update_script \
                   addon_files/mosquitto/bin/mosquitto-service addon_files/mosquitto/bin/mosquitto-update; do
            sh -n "$f"
          done

      - name: shellcheck (errors only, the addon scripts run on busybox ash)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S error -s sh build_in_container.sh addon_files/update_script \
              addon_files/mosquitto/bin/mosquitto-service addon_files/mosquitto/bin/mosquitto-update
          shellcheck -S error build.sh build_addon.sh build_release_body.sh

      - name: JavaScript syntax
        run: |
          for f in addon_files/mosquitto/www/js/script.js build_licenses.js update_versions.js test/*.js; do
            node --check "$f"
          done

      - name: mosquitto.conf parser unit test
        run: npm run test:unit

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [armv7l, aarch64, x86_64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'x86_64'
        with:
          platforms: arm,arm64

      - name: Install patchelf
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf >/dev/null

      - name: Build addon package
        run: ./build_addon.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v5
        with:
          name: mosquitto-${{ matrix.arch }}
          path: dist/*
          retention-days: 14

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: mosquitto-x86_64
          path: dist

      - name: Install test dependencies (mqtt client, playwright with chromium)
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End-to-end test (x86_64 package in a Debian container)
        run: npm run test:e2e

      - name: Web UI test (settings page and CGIs through lighttpd in the container, headless chromium)
        run: npm run test:webui
