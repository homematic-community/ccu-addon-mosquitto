# lighttpd for the web UI tests, the CCU's rules: .cgi -> tclsh, /addons from
# /usr/local/etc/config/addons/www, X-Sendfile for /usr/local/tmp, the init
# script's PATH (with /sbin); the fake curl first; the update worker fetches from the
# local http server instead of GitHub.
server.modules = ("mod_alias", "mod_cgi", "mod_setenv", "mod_accesslog")
server.document-root = "/www"
server.port = 80
server.errorlog = "/var/log/lighttpd-error.log"
accesslog.filename = "/var/log/lighttpd-access.log"
index-file.names = ("index.html", "index.cgi")
mimetype.assign = (".html" => "text/html", ".css" => "text/css", ".js" => "application/javascript", ".png" => "image/png", ".txt" => "text/plain", ".json" => "application/json", "" => "application/octet-stream")
cgi.assign = (".cgi" => "/usr/bin/tclsh")
cgi.x-sendfile = "enable"
cgi.x-sendfile-docroot = ("/usr/local/tmp")
setenv.add-environment = ("PATH" => "/usr/local/bin:/sbin:/usr/sbin:/bin:/usr/bin", "MOSQUITTO_UPDATE_BASE_URL" => "http://127.0.0.1:8081")
